[project]
name = "tools"
version = "0.1.0"
description = "Toolchain for running replays on AutoPas measurement data to evaluate tuning strategies."

requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[project.scripts]
generate = "tools.scripts.generate_job:main"
analysis = "tools.scripts.run_analysis:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
